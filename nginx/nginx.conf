upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name dscc-cw-blog.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dscc-cw-blog.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/dscc-cw-blog.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dscc-cw-blog.duckdns.org/privkey.pem;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
        access_log off;
        proxy_pass http://django;
    }
}